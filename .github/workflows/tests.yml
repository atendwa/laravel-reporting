name: Tests

on:
  push:
    branches: ['develop', 'main']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_AUTH: ${{ secrets.PACKAGES_TOKEN && format('{{"github-oauth":{{"github.com":"{0}"}}}}', secrets.PACKAGES_TOKEN) || '' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, openssl, ldap
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Tests
        run: vendor/bin/pest --compact
